name: Build offline map pack

on:
  workflow_dispatch:
    inputs:
      pack_id:
        description: Unique map-pack identifier
        required: true
        type: string
      bbox:
        description: west,south,east,north
        required: true
        type: string
      max_zoom:
        description: Maximum map zoom
        required: true
        default: '14'
        type: string

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Install PMTiles
        run: |
          curl -fsSL https://github.com/protomaps/go-pmtiles/releases/latest/download/go-pmtiles_linux_amd64.tar.gz | tar -xz pmtiles
          chmod +x pmtiles
      - name: Build selected area
        env:
          BASEMAP_URL: ${{ vars.OFFLINE_BASEMAP_URL }}
        run: |
          test -n "$BASEMAP_URL"
          ./pmtiles extract "$BASEMAP_URL" "${{ inputs.pack_id }}.pmtiles" --bbox="${{ inputs.bbox }}" --maxzoom="${{ inputs.max_zoom }}"
      - name: Store package in R2
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          PACK_ID: ${{ inputs.pack_id }}
          R2_ENDPOINT: ${{ vars.R2_S3_ENDPOINT }}
          R2_BUCKET: mapapp-offline-packs
        run: |
          aws s3 cp "$PACK_ID.pmtiles" "s3://$R2_BUCKET/packs/$PACK_ID.pmtiles" --endpoint-url "$R2_ENDPOINT"
          printf '{"status":"ready","file":"packs/%s.pmtiles"}' "$PACK_ID" > status.json
          aws s3 cp status.json "s3://$R2_BUCKET/status/$PACK_ID.json" --endpoint-url "$R2_ENDPOINT"
