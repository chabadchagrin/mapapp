name: Inspect Cuyahoga services
on:
  push:
    branches: [data-refresh]
    paths: [tools/inspect_cuyahoga.py]
permissions: {contents: write}
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - run: python3 tools/inspect_cuyahoga.py
      - run: |
          git config user.name "github-actions[bot]"; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add inspect/cuyahoga2.md; git commit -m "Cuyahoga inspection report 2"; git pull --rebase -q; git push
