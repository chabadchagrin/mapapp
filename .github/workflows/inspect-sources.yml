name: Inspect county data sources
on:
  push:
    branches: [data-refresh]
    paths: [tools/inspect_sources.py, .github/workflows/inspect-sources.yml]
permissions:
  contents: write
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python3 tools/inspect_sources.py
      - name: Commit report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add inspect/report.md
          git commit -m "Source inspection report" && git push
