name: Inspect county data sources
on:
  push:
    branches: [data-refresh]
    paths: [tools/inspect_sources2.py]
permissions:
  contents: write
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install openpyxl
      - run: python3 tools/inspect_sources2.py
      - name: Commit report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add inspect/report2.md
          git commit -m "Source inspection report 2" && git pull --rebase -q && git push
