<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>The Map App</title><link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"><style>html,body,#map{height:100%;margin:0;font-family:Arial}.search-bar{position:fixed;z-index:999;top:14px;left:14px;right:14px;display:flex;gap:8px;padding:7px;border-radius:14px;background:#fffe;box-shadow:0 4px 18px #1234}.search-bar input{min-width:0;flex:1;border:0;outline:0;padding:9px;font-size:16px;background:transparent}.search-bar button,.locate{border:0;background:#0f766e;color:white;font-weight:bold}.search-bar button{padding:0 15px;border-radius:10px}.locate{position:fixed;z-index:999;right:16px;bottom:94px;width:52px;height:52px;border-radius:50%;font-size:0;box-shadow:0 3px 12px #1235}.locate:after{content:'⌖';font-size:29px;line-height:1}.toast{position:fixed;z-index:999;left:50%;bottom:26px;transform:translateX(-50%);max-width:80%;padding:9px 13px;border-radius:18px;background:#102a43eF;color:white;font-size:13px;text-align:center}.toast:empty{display:none}.parcel-popup{min-width:185px}.parcel-popup span{font-size:10px;font-weight:bold;color:#0f766e}.parcel-popup strong{display:block;margin-top:3px}.parcel-popup p{font-size:13px;line-height:1.35;margin:8px 0 5px}.parcel-popup small{color:#627d98;font-size:11px}.suggestions{position:fixed;z-index:998;top:69px;left:14px;right:14px;max-width:390px;overflow:hidden;border-radius:12px;background:#fffe;box-shadow:0 4px 18px #1234}.suggestions:empty{display:none}.suggestions button{display:block;width:100%;padding:12px;border:0;border-bottom:1px solid #d9e2ec;background:white;color:#243b53;text-align:left;font-size:14px}.suggestions small{display:block;margin-top:3px;color:#627d98}@media(min-width:700px){.search-bar{left:24px;right:auto;width:390px}.suggestions{left:24px;right:auto;width:390px}.locate{right:24px;bottom:94px}}</style></head><body><div id="map"></div><form class="search-bar" id="search-form"><input id="address" type="search" placeholder="Search an address or owner" autocomplete="off"><button>Search</button></form><button id="locate" class="locate" disabled aria-label="Use my location">Use my location</button><div id="status" class="toast"></div><script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script><script>
const status=document.querySelector('#status'),button=document.querySelector('#locate'),map=L.map('map',{zoomControl:false}).setView([41.414,-81.385],15);L.control.zoom({position:'bottomright'}).addTo(map);L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'© OpenStreetMap contributors'}).addTo(map);let loaded=new Map(),loading=new Set(),index,selected,ownerIndexPromise;const boundary={color:'#52707c',weight:.7,opacity:.62,fillOpacity:.012};const esc=s=>String(s||'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));fetch('parcel-data/index.json').then(r=>r.json()).then(i=>{index=i;index.lookup=new Map(i.tiles.map(t=>[t.key,t]));button.disabled=false;update()}).catch(()=>status.textContent='Parcel data could not be loaded. Please refresh.');function selectParcel(l){if(selected&&selected!==l)selected.setStyle(boundary);selected=l;l.setStyle({color:'#0f766e',weight:2,opacity:1,fillOpacity:.08})}function addTile(data,k){const layer=L.geoJSON(data,{style:boundary,onEachFeature:(f,l)=>{const p=f.properties;l.bindPopup(`<section class="parcel-popup"><span>OWNER</span><strong>${esc(p.owner_name||'Owner not listed')}</strong><p>${esc(p.property_address||'Address not listed')}<br>${esc(p.property_city)} ${esc(p.property_zip)}</p><small>${esc(p.jurisdiction)} · ${esc(p.source_county)}</small></section>`);l.on('click',()=>selectParcel(l))}}).addTo(map);loaded.set(k,layer)}function update(){if(!index)return;const b=map.getBounds(),s=index.cellSize,need=new Set;for(let x=Math.floor(b.getWest()/s)-1;x<=Math.floor(b.getEast()/s)+1;x++)for(let y=Math.floor(b.getSouth()/s)-1;y<=Math.floor(b.getNorth()/s)+1;y++)need.add(x+'_'+y);for(const[k,l]of loaded)if(!need.has(k)){map.removeLayer(l);loaded.delete(k)}const todo=[...need].filter(k=>!loaded.has(k)&&!loading.has(k)&&index.lookup.has(k));if(!todo.length)return;status.textContent='Loading property outlines…';todo.forEach(k=>{loading.add(k);fetch(index.lookup.get(k).url.replace(/^\//,'')).then(r=>{if(!r.ok)throw Error();return r.json()}).then(data=>addTile(data,k)).catch(()=>{}).finally(()=>{loading.delete(k);if(!loading.size)status.textContent='Tap an outlined property to see the owner.'})})}map.on('moveend',update);button.onclick=()=>navigator.geolocation?navigator.geolocation.getCurrentPosition(p=>map.setView([p.coords.latitude,p.coords.longitude],17),()=>status.textContent='Location permission was not granted. Move the map instead.',{enableHighAccuracy:true,timeout:10000}):status.textContent='Location is not available on this device.';
(()=>{const address=document.querySelector('#address'),form=document.querySelector('#search-form'),list=document.createElement('div');list.className='suggestions';document.body.appendChild(list);let matches=[],timer;const addressSearch=q=>fetch('https://nominatim.openstreetmap.org/search?format=jsonv2&countrycodes=us&limit=5&viewbox=-81.65,41.65,-80.85,41.1&q='+encodeURIComponent(q)).then(r=>r.json());function center(g){let minX=Infinity,minY=Infinity,maxX=-Infinity,maxY=-Infinity;const scan=x=>typeof x[0]==='number'?(minX=Math.min(minX,x[0]),maxX=Math.max(maxX,x[0]),minY=Math.min(minY,x[1]),maxY=Math.max(maxY,x[1])):x.forEach(scan);scan(g.coordinates);return{lat:(minY+maxY)/2,lng:(minX+maxX)/2}}async function ownerMatches(q){if(!index)return[];if(!ownerIndexPromise){status.textContent='Preparing owner search…';ownerIndexPromise=Promise.all(index.tiles.map(t=>fetch(t.url.replace(/^\//,'')).then(r=>r.json()).then(d=>d.features.map(f=>({p:f.properties,...center(f.geometry)}))))).then(chunks=>chunks.flat())}const needle=q.toLowerCase(),records=await ownerIndexPromise;return records.filter(x=>String(x.p.owner_name||'').toLowerCase().includes(needle)).slice(0,8)}function draw(items){matches=items;list.innerHTML='';items.forEach((x,i)=>{const b=document.createElement('button');b.type='button';b.dataset.i=i;if(x.kind==='owner'){b.textContent=x.p.owner_name||'Owner not listed';const s=document.createElement('small');s.textContent=[x.p.property_address,x.p.property_city].filter(Boolean).join(', ');b.appendChild(s)}else b.textContent=x.display_name;list.appendChild(b)})}function go(x){list.innerHTML='';if(x.kind==='owner'){address.value=x.p.owner_name||'';map.setView([x.lat,x.lng],18);status.textContent='Owner found. Tap the outlined property.'}else{address.value=x.display_name;map.setView([+x.lat,+x.lon],17);status.textContent=''}}async function run(q){const names=/[a-z]/i.test(q)?ownerMatches(q):Promise.resolve([]),places=addressSearch(q).catch(()=>[]),[owners,addresses]=await Promise.all([names,places]);return[...owners.map(x=>({...x,kind:'owner'})),...addresses.map(x=>({...x,kind:'address'}))].slice(0,8)}address.addEventListener('input',()=>{clearTimeout(timer);const q=address.value.trim();list.innerHTML='';if(q.length<3)return;timer=setTimeout(()=>run(q).then(draw).catch(()=>status.textContent='Search is unavailable. Try again.'),450)});list.addEventListener('click',e=>{const i=e.target.closest('button')?.dataset.i;if(i!==undefined)go(matches[i])});form.onsubmit=e=>{e.preventDefault();const q=address.value.trim();if(!q)return;status.textContent='Searching…';run(q).then(r=>r.length?go(r[0]):status.textContent='No matching address or owner found.').catch(()=>status.textContent='Search is unavailable. Try again.')};})();
