<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>The Map App</title><style>html,body,#map{height:100%;margin:0;font-family:Arial}.search-bar{position:fixed;z-index:2;top:14px;left:14px;right:14px;display:flex;gap:8px;padding:7px;border-radius:14px;background:#fffe;box-shadow:0 4px 18px #1234}.search-bar input{min-width:0;flex:1;border:0;outline:0;padding:9px;font-size:16px;background:transparent}.search-bar button,.locate{border:0;background:#0f766e;color:white;font-weight:bold}.search-bar button{padding:0 15px;border-radius:10px}.locate{position:fixed;z-index:2;right:16px;bottom:94px;width:52px;height:52px;border-radius:50%;font-size:0;box-shadow:0 3px 12px #1235}.locate:after{content:'⌖';font-size:29px;line-height:1}.toast{position:fixed;z-index:2;left:50%;bottom:26px;transform:translateX(-50%);max-width:80%;padding:9px 13px;border-radius:18px;background:#102a43eF;color:white;font-size:13px;text-align:center}.toast:empty{display:none}.suggestions{position:fixed;z-index:2;top:69px;left:14px;right:14px;max-width:390px;overflow:hidden;border-radius:12px;background:#fffe;box-shadow:0 4px 18px #1234}.suggestions:empty{display:none}.suggestions button{display:block;width:100%;padding:12px;border:0;border-bottom:1px solid #d9e2ec;background:white;color:#243b53;text-align:left;font-size:14px}.suggestions small{display:block;margin-top:3px;color:#627d98}@media(min-width:700px){.search-bar{left:24px;right:auto;width:390px}.suggestions{left:24px;right:auto;width:390px}.locate{right:24px;bottom:94px}}</style></head><body><div id="map"></div><form class="search-bar" id="search-form"><input id="address" type="search" placeholder="Search an address or owner" autocomplete="off"><button>Search</button></form><button id="locate" class="locate" disabled aria-label="Use my location">Use my location</button><div id="status" class="toast"></div><script>
let map,index,selected,ownerIndexPromise,info,loaded=new Map(),loading=new Set();const status=document.querySelector('#status'),button=document.querySelector('#locate'),esc=s=>String(s||'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));function initMap(){map=new google.maps.Map(document.querySelector('#map'),{center:{lat:41.414,lng:-81.385},zoom:15,mapTypeControl:false,streetViewControl:false,fullscreenControl:false,gestureHandling:'greedy'});info=new google.maps.InfoWindow();map.data.setStyle({strokeOpacity:0,fillOpacity:.001,clickable:true});map.data.addListener('click',e=>{selected=e.feature;map.data.revertStyle();map.data.overrideStyle(selected,{strokeColor:'#0f766e',strokeWeight:2,strokeOpacity:1,fillColor:'#0f766e',fillOpacity:.06});const p=Object.fromEntries(['owner_name','property_address','property_city','property_zip','jurisdiction','source_county'].map(k=>[k,e.feature.getProperty(k)]));info.setContent(`<div style="min-width:185px"><b style="font-size:10px;color:#0f766e">OWNER</b><strong style="display:block;margin-top:3px">${esc(p.owner_name||'Owner not listed')}</strong><p style="font-size:13px;line-height:1.35;margin:8px 0 5px">${esc(p.property_address||'Address not listed')}<br>${esc(p.property_city)} ${esc(p.property_zip)}</p><small style="color:#627d98">${esc(p.jurisdiction)} · ${esc(p.source_county)}</small></div>`);info.setPosition(e.latLng);info.open(map)});fetch('parcel-data/index.json').then(r=>r.json()).then(i=>{index=i;index.lookup=new Map(i.tiles.map(t=>[t.key,t]));button.disabled=false;update()}).catch(()=>status.textContent='Parcel data could not be loaded. Refresh and try again.');map.addListener('idle',update)}function update(){if(!index)return;const b=map.getBounds();if(!b)return;const s=index.cellSize,need=new Set,ne=b.getNorthEast(),sw=b.getSouthWest();for(let x=Math.floor(sw.lng()/s)-1;x<=Math.floor(ne.lng()/s)+1;x++)for(let y=Math.floor(sw.lat()/s)-1;y<=Math.floor(ne.lat()/s)+1;y++)need.add(x+'_'+y);for(const[k,features]of loaded)if(!need.has(k)){features.forEach(f=>map.data.remove(f));loaded.delete(k)}const todo=[...need].filter(k=>!loaded.has(k)&&!loading.has(k)&&index.lookup.has(k));if(!todo.length)return;status.textContent='Loading properties…';todo.forEach(k=>{loading.add(k);fetch(index.lookup.get(k).url.replace(/^\//,'')).then(r=>r.json()).then(d=>loaded.set(k,map.data.addGeoJson(d))).catch(()=>{}).finally(()=>{loading.delete(k);if(!loading.size)status.textContent='Tap a house or property to see the owner.'})})}button.onclick=()=>navigator.geolocation?navigator.geolocation.getCurrentPosition(p=>map.setCenter({lat:p.coords.latitude,lng:p.coords.longitude}),()=>status.textContent='Location permission was not granted.',{enableHighAccuracy:true,timeout:10000}):status.textContent='Location is not available on this device.';(()=>{const address=document.querySelector('#address'),form=document.querySelector('#search-form'),list=document.createElement('div');list.className='suggestions';document.body.appendChild(list);let matches=[],timer;const addressSearch=q=>fetch('https://nominatim.openstreetmap.org/search?format=jsonv2&countrycodes=us&limit=5&viewbox=-81.65,41.65,-80.85,41.1&q='+encodeURIComponent(q)).then(r=>r.json());function center(g){let a=Infinity,b=Infinity,c=-Infinity,d=-Infinity;const scan=x=>typeof x[0]==='number'?(a=Math.min(a,x[0]),c=Math.max(c,x[0]),b=Math.min(b,x[1]),d=Math.max(d,x[1])):x.forEach(scan);scan(g.coordinates);return{lat:(b+d)/2,lng:(a+c)/2}}async function owners(q){if(!index)return[];if(!ownerIndexPromise)ownerIndexPromise=Promise.all(index.tiles.map(t=>fetch(t.url.replace(/^\//,'')).then(r=>r.json()).then(d=>d.features.map(f=>({p:f.properties,...center(f.geometry)}))))).then(x=>x.flat());status.textContent='Preparing owner search…';const all=await ownerIndexPromise,n=q.toLowerCase();return all.filter(x=>String(x.p.owner_name||'').toLowerCase().includes(n)).slice(0,8)}function draw(items){matches=items;list.innerHTML='';items.forEach((x,i)=>{const b=document.createElement('button');b.type='button';b.dataset.i=i;if(x.kind==='owner'){b.textContent=x.p.owner_name||'Owner not listed';const s=document.createElement('small');s.textContent=[x.p.property_address,x.p.property_city].filter(Boolean).join(', ');b.appendChild(s)}else b.textContent=x.display_name;list.appendChild(b)})}function go(x){list.innerHTML='';if(x.kind==='owner'){address.value=x.p.owner_name||'';map.setCenter({lat:x.lat,lng:x.lng});map.setZoom(18);status.textContent='Owner found. Tap the property.'}else{address.value=x.display_name;map.setCenter({lat:+x.lat,lng:+x.lon});map.setZoom(17);status.textContent=''}}async function run(q){const a=/[a-z]/i.test(q)?owners(q):Promise.resolve([]),b=addressSearch(q).catch(()=>[]),[o,p]=await Promise.all([a,b]);return[...o.map(x=>({...x,kind:'owner'})),...p.map(x=>({...x,kind:'address'}))].slice(0,8)}address.addEventListener('input',()=>{clearTimeout(timer);const q=address.value.trim();list.innerHTML='';if(q.length<3)return;timer=setTimeout(()=>run(q).then(draw).catch(()=>status.textContent='Search is unavailable.'),450)});list.addEventListener('click',e=>{const i=e.target.closest('button')?.dataset.i;if(i!==undefined)go(matches[i])});form.onsubmit=e=>{e.preventDefault();run(address.value.trim()).then(r=>r.length?go(r[0]):status.textContent='No match found.')}})();
</script><script async src="https://maps.googleapis.com/maps/api/js?key=AIzaSyBiSEcwh7LTk7RmFyzyNPOYMQzYswJt7FM&callback=initMap"></script></body></html>
