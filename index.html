<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Canvassing Map</title><meta name="theme-color" content="#0f766e"><link rel="manifest" href="manifest.json"><link rel="icon" href="icon-192.png"><link rel="apple-touch-icon" href="icon-192.png"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><style>
html,body,#map{height:100%;margin:0;font-family:Arial}
.top-bar{position:fixed;z-index:3;top:14px;left:14px;right:14px;display:flex;gap:8px;align-items:center}
.search-bar{flex:1;min-width:0;display:flex;gap:6px;padding:7px;border-radius:14px;background:#fffe;box-shadow:0 4px 18px #1234}
.search-bar input{min-width:0;flex:1;border:0;outline:0;padding:9px;font-size:16px;background:transparent}
.search-bar button{border:0;background:#0f766e;color:#fff;font-weight:bold;padding:0 15px;border-radius:10px}
.menu-btn{flex:none;width:46px;height:46px;border-radius:50%;border:0;background:#fffe;box-shadow:0 4px 18px #1234;font-size:20px;color:#0f766e}
.locate{position:fixed;z-index:2;right:16px;bottom:30px;width:52px;height:52px;border-radius:50%;border:0;background:#0f766e;color:#fff;font-size:0;box-shadow:0 3px 12px #1235}
.locate:after{content:'⌖';font-size:29px;line-height:1}
.toast{position:fixed;z-index:2;left:50%;bottom:26px;transform:translateX(-50%);max-width:80%;padding:9px 13px;border-radius:18px;background:#102a43eF;color:#fff;font-size:13px;text-align:center}
.toast:empty{display:none}
.suggestions{position:fixed;z-index:3;top:69px;left:14px;right:70px;max-width:390px;overflow:hidden;border-radius:12px;background:#fffe;box-shadow:0 4px 18px #1234}
.suggestions:empty{display:none}
.suggestions button{display:block;width:100%;padding:12px;border:0;border-bottom:1px solid #d9e2ec;background:#fff;color:#243b53;text-align:left;font-size:14px}
.suggestions small{display:block;margin-top:3px;color:#627d98}
.menu-panel{position:fixed;z-index:4;top:68px;right:14px;width:260px;max-width:calc(100% - 28px);border-radius:14px;background:#fff;box-shadow:0 8px 28px #1235;padding:14px}
.menu-panel[hidden]{display:none}
.menu-panel h2{margin:0 0 8px;font-size:14px;color:#102a43}
.menu-panel p{margin:6px 0;font-size:12px;color:#486581;line-height:1.4}
.menu-panel button{width:100%;border:0;border-radius:10px;padding:11px;font-weight:bold;font-size:14px;margin-top:8px}
.menu-panel .download{background:#0f766e;color:#fff}
.menu-panel .clear{background:transparent;color:#627d98;font-weight:normal;font-size:12px;text-decoration:underline;padding:6px}
.menu-close{position:absolute;top:8px;right:10px;border:0;background:transparent;font-size:16px;color:#829ab1}
@media(min-width:700px){.top-bar{left:24px;right:auto;width:430px}.suggestions{left:24px;right:auto;width:390px}.locate{right:24px}.menu-panel{right:auto;left:24px;top:68px}}
</style></head><body>
<div id="map"></div>
<div class="top-bar">
  <form class="search-bar" id="search-form">
    <input id="address" type="search" placeholder="Search an address or owner" autocomplete="off">
    <button type="submit" aria-label="Search">Search</button>
  </form>
  <button id="menu-btn" class="menu-btn" type="button" aria-label="Menu">☰</button>
</div>
<div class="menu-panel" id="menu-panel" hidden>
  <button class="menu-close" id="menu-close" type="button" aria-label="Close menu">✕</button>
  <h2>Offline data</h2>
  <div id="offline-panel"></div>
</div>
<button id="locate" class="locate" disabled aria-label="Use my location"></button>
<div id="status" class="toast"></div>
<script>
let map,index,selected,ownerIndexPromise,info,loaded=new Map(),loading=new Set();const status=document.querySelector('#status'),button=document.querySelector('#locate'),esc=s=>String(s||'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));function initMap(){map=new google.maps.Map(document.querySelector('#map'),{center:{lat:41.414,lng:-81.385},zoom:15,mapTypeControl:false,streetViewControl:false,fullscreenControl:false,gestureHandling:'greedy'});info=new google.maps.InfoWindow();map.data.setStyle({strokeOpacity:0,fillOpacity:.001,clickable:true});map.data.addListener('click',e=>showParcel(e.feature,e.latLng));fetch('parcel-data/index.json').then(r=>r.json()).then(i=>{index=i;index.lookup=new Map(i.tiles.map(t=>[t.key,t]));button.disabled=false;update()}).catch(()=>status.textContent='Parcel data could not be loaded. Refresh and try again.');map.addListener('idle',update)}function showParcel(feature,position){selected=feature;map.data.revertStyle();map.data.overrideStyle(selected,{strokeColor:'#0f766e',strokeWeight:2,strokeOpacity:1,fillColor:'#0f766e',fillOpacity:.06});const p=Object.fromEntries(['owner_name','property_address','property_city','property_zip','jurisdiction','source_county'].map(k=>[k,feature.getProperty(k)])),searchUrl='https://www.google.com/search?q='+encodeURIComponent(`${p.owner_name||''} Jewish Cleveland`);info.setContent(`<div style="min-width:185px"><b style="font-size:10px;color:#0f766e">OWNER</b><strong style="display:block;margin-top:3px">${esc(p.owner_name||'Owner not listed')}</strong><p style="font-size:13px;line-height:1.35;margin:8px 0 5px">${esc(p.property_address||'Address not listed')}<br>${esc(p.property_city)} ${esc(p.property_zip)}</p><small style="color:#627d98">${esc(p.jurisdiction)} · ${esc(p.source_county)}</small>${p.owner_name?`<a href="${searchUrl}" target="_blank" rel="noopener noreferrer" aria-label="Search Google for ${esc(p.owner_name)} Jewish Cleveland" title="Search Google" style="display:inline-flex;align-items:center;justify-content:center;width:32px;height:32px;margin:10px 0 0;border-radius:50%;background:#0f766e;color:#fff;text-decoration:none;font-size:20px;font-weight:bold">↗</a>`:''}</div>`);info.setPosition(position);info.open(map)}function inRing(x,y,r){let hit=false;for(let i=0,j=r.length-1;i<r.length;j=i++){const a=r[i],b=r[j];if(((a[1]>y)!==(b[1]>y))&&x<(b[0]-a[0])*(y-a[1])/(b[1]-a[1])+a[0])hit=!hit}return hit}function contains(g,x,y){const polys=g.type==='Polygon'?[g.coordinates]:g.coordinates;return polys.some(poly=>inRing(x,y,poly[0])&&!poly.slice(1).some(h=>inRing(x,y,h)))}function focusParcel(lat,lng,tries=14){for(const entry of loaded.values())for(const r of entry.records)if(contains(r.raw.geometry,lng,lat)){showParcel(r.feature,new google.maps.LatLng(lat,lng));return}if(tries)setTimeout(()=>focusParcel(lat,lng,tries-1),300);else status.textContent='Location found, but its parcel is not in the downloaded area.'}function update(){if(!index)return;const b=map.getBounds();if(!b)return;const s=index.cellSize,need=new Set,ne=b.getNorthEast(),sw=b.getSouthWest();for(let x=Math.floor(sw.lng()/s)-1;x<=Math.floor(ne.lng()/s)+1;x++)for(let y=Math.floor(sw.lat()/s)-1;y<=Math.floor(ne.lat()/s)+1;y++)need.add(x+'_'+y);for(const[k,entry]of loaded)if(!need.has(k)){entry.features.forEach(f=>map.data.remove(f));loaded.delete(k)}const todo=[...need].filter(k=>!loaded.has(k)&&!loading.has(k)&&index.lookup.has(k));if(!todo.length)return;status.textContent='Loading properties…';todo.forEach(k=>{loading.add(k);fetch(index.lookup.get(k).url.replace(/^\//,'')).then(r=>r.json()).then(d=>{const features=map.data.addGeoJson(d);loaded.set(k,{features,records:d.features.map((raw,i)=>({raw,feature:features[i]}))})}).catch(()=>{}).finally(()=>{loading.delete(k);if(!loading.size)status.textContent='' })})}button.onclick=()=>navigator.geolocation?navigator.geolocation.getCurrentPosition(p=>map.setCenter({lat:p.coords.latitude,lng:p.coords.longitude}),()=>status.textContent='Location permission was not granted.',{enableHighAccuracy:true,timeout:10000}):status.textContent='Location is not available on this device.';(()=>{const address=document.querySelector('#address'),form=document.querySelector('#search-form'),list=document.createElement('div');list.className='suggestions';document.body.appendChild(list);let matches=[],timer;const addressSearch=q=>fetch('https://nominatim.openstreetmap.org/search?format=jsonv2&countrycodes=us&limit=5&viewbox=-81.65,41.65,-80.85,41.1&q='+encodeURIComponent(q)).then(r=>r.json());function center(g){let a=Infinity,b=Infinity,c=-Infinity,d=-Infinity;const scan=x=>typeof x[0]==='number'?(a=Math.min(a,x[0]),c=Math.max(c,x[0]),b=Math.min(b,x[1]),d=Math.max(d,x[1])):x.forEach(scan);scan(g.coordinates);return{lat:(b+d)/2,lng:(a+c)/2}}async function owners(q){if(!index)return[];if(!ownerIndexPromise)ownerIndexPromise=Promise.all(index.tiles.map(t=>fetch(t.url.replace(/^\//,'')).then(r=>r.json()).then(d=>d.features.map(f=>({p:f.properties,...center(f.geometry)}))))).then(x=>x.flat());status.textContent='Preparing owner search…';const all=await ownerIndexPromise,n=q.toLowerCase();return all.filter(x=>String(x.p.owner_name||'').toLowerCase().includes(n)).slice(0,8)}function draw(items){matches=items;list.innerHTML='';items.forEach((x,i)=>{const b=document.createElement('button');b.type='button';b.dataset.i=i;if(x.kind==='owner'){b.textContent='Owner: '+(x.p.owner_name||'Owner not listed');const s=document.createElement('small');s.textContent=[x.p.property_address,x.p.property_city].filter(Boolean).join(', ');b.appendChild(s)}else b.textContent='Address: '+x.display_name;list.appendChild(b)})}function go(x){list.innerHTML='';if(x.kind==='owner'){address.value=x.p.owner_name||'';map.setCenter({lat:x.lat,lng:x.lng});map.setZoom(18);status.textContent='Owner found.';focusParcel(x.lat,x.lng)}else{address.value=x.display_name;map.setCenter({lat:+x.lat,lng:+x.lon});map.setZoom(17);status.textContent='';focusParcel(+x.lat,+x.lon)}}async function run(q){const a=/[a-z]/i.test(q)?owners(q):Promise.resolve([]),b=addressSearch(q).catch(()=>[]),[o,p]=await Promise.all([a,b]);return[...o.map(x=>({...x,kind:'owner'})),...p.map(x=>({...x,kind:'address'}))].slice(0,8)}address.addEventListener('input',()=>{clearTimeout(timer);const q=address.value.trim();list.innerHTML='';if(q.length<3)return;timer=setTimeout(()=>run(q).then(draw).catch(()=>status.textContent='Search is unavailable.'),450)});list.addEventListener('click',e=>{const i=e.target.closest('button')?.dataset.i;if(i!==undefined)go(matches[i])});form.onsubmit=e=>{e.preventDefault();run(address.value.trim()).then(r=>r.length?go(r[0]):status.textContent='No match found.')}})();
</script>
<script>if('serviceWorker'in navigator)navigator.serviceWorker.register('service-worker.js').catch(()=>{});(()=>{let marker,accuracyRing,watch,locateMsgTimer;function display(p,move){const here={lat:p.coords.latitude,lng:p.coords.longitude},accuracy=Math.max(p.coords.accuracy||0,1);if(!marker)marker=new google.maps.Marker({map,icon:{path:google.maps.SymbolPath.CIRCLE,fillColor:'#1a73e8',fillOpacity:1,strokeColor:'#fff',strokeOpacity:1,strokeWeight:3,scale:9},title:'Your location',zIndex:1000});if(!accuracyRing)accuracyRing=new google.maps.Circle({map,strokeColor:'#1a73e8',strokeOpacity:.5,strokeWeight:1,fillColor:'#1a73e8',fillOpacity:.12,clickable:false});marker.setPosition(here);accuracyRing.setCenter(here);accuracyRing.setRadius(accuracy);if(move){map.panTo(here);if(map.getZoom()<17)map.setZoom(17)}status.textContent='';if(accuracy>100){const msg=`Your location is accurate to about ${Math.round(accuracy)} meters.`;status.textContent=msg;clearTimeout(locateMsgTimer);locateMsgTimer=setTimeout(()=>{if(status.textContent===msg)status.textContent=''},4000)}}button.onclick=()=>{if(!navigator.geolocation){status.textContent='Location is not available on this device.';return}button.disabled=true;status.textContent='Finding your location…';navigator.geolocation.getCurrentPosition(p=>{display(p,true);button.disabled=false;if(!watch)watch=navigator.geolocation.watchPosition(p=>display(p,false),()=>{},{enableHighAccuracy:true,maximumAge:15000,timeout:20000})},e=>{button.disabled=false;status.textContent=e.code===1?'Location permission was not granted.':'Your location could not be found. Try again where reception is stronger.'},{enableHighAccuracy:true,maximumAge:10000,timeout:20000})}})();</script>
<script>
(function(){
  const btn=document.querySelector('#menu-btn'),panel=document.querySelector('#menu-panel'),close=document.querySelector('#menu-close');
  btn.onclick=()=>panel.hidden=!panel.hidden;
  close.onclick=()=>panel.hidden=true;
  document.addEventListener('click',e=>{if(!panel.hidden&&!panel.contains(e.target)&&e.target!==btn)panel.hidden=true});
})();
</script>
<script src="offline-controls.js"></script>
<script async src="https://maps.googleapis.com/maps/api/js?key=AIzaSyBiSEcwh7LTk7RmFyzyNPOYMQzYswJt7FM&callback=initMap"></script>
</body></html>
