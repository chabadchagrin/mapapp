<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Parcel Finder</title><link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"><style>html,body,#map{height:100%;margin:0;font-family:Arial}.search-bar{position:fixed;z-index:999;top:14px;left:14px;right:14px;display:flex;gap:8px;padding:7px;border-radius:14px;background:#fffe;box-shadow:0 4px 18px #1234}.search-bar input{min-width:0;flex:1;border:0;outline:0;padding:9px;font-size:16px;background:transparent}.search-bar button,.locate{border:0;background:#0f766e;color:white;font-weight:bold}.search-bar button{padding:0 15px;border-radius:10px}.locate{position:fixed;z-index:999;right:16px;bottom:28px;width:52px;height:52px;border-radius:50%;font-size:0;box-shadow:0 3px 12px #1235}.locate:after{content:'⌖';font-size:29px;line-height:1}.toast{position:fixed;z-index:999;left:50%;bottom:26px;transform:translateX(-50%);max-width:80%;padding:9px 13px;border-radius:18px;background:#102a43eF;color:white;font-size:13px;text-align:center}.toast:empty{display:none}.parcel-popup{min-width:185px}.parcel-popup span{font-size:10px;font-weight:bold;color:#0f766e}.parcel-popup strong{display:block;margin-top:3px}.parcel-popup p{font-size:13px;line-height:1.35;margin:8px 0 5px}.parcel-popup small{color:#627d98;font-size:11px}@media(min-width:700px){.search-bar{left:24px;right:auto;width:390px}.locate{right:24px;bottom:32px}}</style></head><body><div id="map"></div><form class="search-bar" id="search-form"><input id="address" type="search" placeholder="Search an address" autocomplete="street-address"><button>Search</button></form><button id="locate" class="locate" disabled aria-label="Use my location">Use my location</button><div id="status" class="toast"></div><script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script><script>
const status=document.querySelector('#status'),button=document.querySelector('#locate'),map=L.map('map',{zoomControl:false}).setView([41.414,-81.385],15);L.control.zoom({position:'bottomright'}).addTo(map);L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'© OpenStreetMap contributors'}).addTo(map);let loaded=new Map(),index,version=0,selected;const hidden={color:'#075985',weight:0,opacity:0,fillOpacity:.001};const esc=s=>String(s||'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
fetch('parcel-data/index.json').then(r=>r.json()).then(i=>{index=i;index.lookup=new Map(i.tiles.map(t=>[t.key,t]));button.disabled=false;update();});document.querySelector('#search-form').onsubmit=e=>{e.preventDefault();const q=document.querySelector('#address').value.trim();if(!q)return;status.textContent='Searching…';fetch('https://nominatim.openstreetmap.org/search?format=jsonv2&limit=1&q='+encodeURIComponent(q)).then(r=>r.json()).then(results=>{if(!results.length){status.textContent='Address not found.';return}map.setView([+results[0].lat,+results[0].lon],17);status.textContent=''}).catch(()=>status.textContent='Search is unavailable. Try again.')};
async function update(){if(!index)return;const v=++version,b=map.getBounds(),s=index.cellSize,need=new Set;for(let x=Math.floor(b.getWest()/s)-1;x<=Math.floor(b.getEast()/s)+1;x++)for(let y=Math.floor(b.getSouth()/s)-1;y<=Math.floor(b.getNorth()/s)+1;y++)need.add(x+'_'+y);for(const[k,l]of loaded)if(!need.has(k)){map.removeLayer(l);loaded.delete(k)}const todo=[...need].filter(k=>!loaded.has(k)&&index.lookup.has(k));if(!todo.length)return;status.textContent='Loading parcels near the map…';await Promise.all(todo.map(async k=>{const data=await fetch(index.lookup.get(k).url.replace('/','')).then(r=>r.json());if(v!==version)return;const layer=L.geoJSON(data,{style:hidden,onEachFeature:(f,l)=>{const p=f.properties;l.bindPopup(`<section class="parcel-popup"><span>OWNER</span><strong>${esc(p.owner_name||'Owner not listed')}</strong><p>${esc(p.property_address||'Address not listed')}<br>${esc(p.property_city)} ${esc(p.property_zip)}</p><small>${esc(p.jurisdiction)} · ${esc(p.source_county)}</small></section>`);l.on('click',()=>{if(selected&&selected!==l)selected.setStyle(hidden);selected=l;l.setStyle({color:'#0f766e',weight:2,opacity:1,fillOpacity:.08})})}}).addTo(map);loaded.set(k,layer)}));status.textContent='Tap a house or lot to see the owner.'}map.on('moveend',update);button.onclick=()=>navigator.geolocation?navigator.geolocation.getCurrentPosition(p=>map.setView([p.coords.latitude,p.coords.longitude],17),()=>status.textContent='Location permission was not granted. Move the map instead.',{enableHighAccuracy:true,timeout:10000}):status.textContent='Location is not available on this device.';
</script></body></html>
